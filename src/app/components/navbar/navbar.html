<!-- 📂 src/app/components/navbar/navbar.html -->
<nav class="navbar">
  <div class="navbar-logo">
    <a routerLink="/">🌿 Portal Empleos</a>
  </div>

  <ul class="navbar-links">
    <!-- 🔹 Menú siempre visible -->
    <li><a routerLink="/home">Inicio</a></li>
    <li><a routerLink="/ofertas-laborales">Ver Ofertas</a></li>

    <!-- 🔹 Rol: CANDIDATO -->
    <li *ngIf="isUser()">
      <!-- 👇 Antes decía 'Mi Panel' -->
      <a routerLink="/candidato">Mis postulaciones</a>
    </li>

    <!-- 🔹 Rol: EMPRESA -->
    <li *ngIf="isCompany()">
      <a routerLink="/empresa">Mis Ofertas</a>
    </li>

    <!-- 🔹 Rol: ADMIN -->
    <li *ngIf="isAdmin()">
      <a routerLink="/admin">Panel Admin</a>
    </li>

    <!-- 🔹 Mostrar perfil y cerrar sesión solo si está logueado -->
    <li *ngIf="isLoggedIn">
      <a routerLink="/perfil">Mi Perfil</a>
    </li>

    <li *ngIf="isLoggedIn">
      <button (click)="logout()">Cerrar sesión</button>
    </li>

    <!-- 🔹 Mostrar login si NO ha iniciado sesión -->
    <li *ngIf="!isLoggedIn">
      <a routerLink="/login">Login</a>
    </li>
  </ul>
</nav>
