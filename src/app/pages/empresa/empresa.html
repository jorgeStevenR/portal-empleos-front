<div class="empresa-container">

  <h2>Mis Ofertas Laborales</h2>

  <!-- FORMULARIO -->
  <form (ngSubmit)="createJob()" class="job-form">
    <input
      [(ngModel)]="newJob.title"
      name="title"
      placeholder="Título del empleo"
      required
    />

    <textarea
      [(ngModel)]="newJob.description"
      name="description"
      placeholder="Descripción"
      required
    ></textarea>

    <input
      [(ngModel)]="newJob.location"
      name="location"
      placeholder="Ubicación"
    />

    <select [(ngModel)]="newJob.mode" name="mode">
      <option value="ONSITE">Presencial</option>
      <option value="REMOTE">Remoto</option>
      <option value="HYBRID">Híbrido</option>
    </select>

    <button type="submit">Publicar oferta</button>
  </form>

  <!-- LISTA DE EMPLEOS -->
  <div class="job-list" *ngIf="jobs.length; else noJobs">

    <div class="job-item" *ngFor="let job of jobs">
      <h3>{{ job.title }}</h3>

      <!-- 🔥 TEXTO FIJO CON SCROLL -->
      <p class="job-description">
        {{ job.description }}
      </p>

      <p><strong>Ubicación:</strong> {{ job.location }}</p>
      <p><strong>Modalidad:</strong> {{ job.mode }}</p>

      <div class="job-actions">
        <button class="btn-delete" (click)="deleteJob(job.idJob)">🗑 Eliminar</button>

        <button class="editar-btn" [routerLink]="['/editar-empleo', job.idJob]">
          ✏ Editar
        </button>

        <button class="ver-postulantes-btn" [routerLink]="['/postulantes-empleo', job.idJob]">
          👥 Ver Postulantes
        </button>
      </div>

    </div>

  </div>

  <ng-template #noJobs>
    <p>No has publicado ofertas aún.</p>
  </ng-template>
</div>
