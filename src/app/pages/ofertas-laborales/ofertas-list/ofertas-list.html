<div class="page-container">
  <section class="ofertas-container">
    
    <h2>Ofertas Laborales Disponibles</h2>

    <input
      type="text"
      placeholder="🔍 Buscar empleo..."
      [(ngModel)]="filtro"
      class="search-input"
    />

    <div *ngIf="cargando" class="loading">
      <span class="spinner"></span> Cargando ofertas...
    </div>

    <div *ngIf="!cargando && empleos.length === 0" class="no-results">
      No hay ofertas disponibles en este momento.
    </div>

    <!-- GRID -->
    <div class="ofertas-grid" *ngIf="!cargando && empleosPagina.length > 0">
      
      <div
        class="oferta-card"
        [class.postulado]="esPostulado(job.idJob)"
        *ngFor="let job of empleosPagina | filtroEmpleos:filtro"
        (click)="verDetalle(job.idJob)"
      >

        <div *ngIf="esPostulado(job.idJob)" class="badge-postulado">
          ✔ Ya postulaste
        </div>
        
        <div class="empresa-header">
          <img
            [src]="job.company?.logoUrl || 'assets/img/default-job.png'"
            class="empresa-logo"
            (error)="onImageError($event)"
          />

          <div class="empresa-info">
            <h4 class="empresa-nombre">{{ job.company?.name }}</h4>
            <span class="ubicacion">{{ job.location }}</span>
          </div>
        </div>

        <h3 class="titulo">{{ job.title }}</h3>

        <p class="descripcion">
          {{
            job.description.length > 100
              ? (job.description | slice: 0:100) + '...'
              : job.description
          }}
        </p>

        <button class="btn-ver" [class.btn-postulado]="esPostulado(job.idJob)">
          Ver más
        </button>

      </div>

    </div>

    <!-- PAGINADOR -->
    <div class="paginador" *ngIf="totalPaginas > 1">
      
      <button (click)="cambiarPagina(paginaActual - 1)" [disabled]="paginaActual === 1">
        ⬅
      </button>

      <span
        *ngFor="let p of [].constructor(totalPaginas); let i = index"
        (click)="cambiarPagina(i + 1)"
        [class.activo]="paginaActual === i + 1"
      >
        {{ i + 1 }}
      </span>

      <button (click)="cambiarPagina(paginaActual + 1)" [disabled]="paginaActual === totalPaginas">
        ➡
      </button>

    </div>

  </section>
</div>
