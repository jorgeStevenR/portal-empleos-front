<div class="page-container">
  <section class="ofertas-container">
    
    <h2>🌿 Ofertas Laborales Disponibles</h2>

    <input
      type="text"
      placeholder="🔍 Buscar empleo..."
      [(ngModel)]="filtro"
      class="search-input"
    />

    <!-- Loading -->
    <div *ngIf="cargando" class="loading">
      <span class="spinner"></span> Cargando ofertas...
    </div>

    <!-- Sin resultados -->
    <div *ngIf="!cargando && empleos.length === 0" class="no-results">
      No hay ofertas disponibles en este momento.
    </div>

    <!-- GRID -->
    <div class="ofertas-grid" *ngIf="!cargando && empleos.length > 0">
      
      <div
        class="oferta-card"
        *ngFor="let job of empleos | filtroEmpleos:filtro"
        (click)="verDetalle(job.idJob)"
      >
        
        <!-- HEADER -->
        <div class="empresa-header">
          <img
            [src]="job.company?.urlImg || 'assets/img/default-job.png'"
            class="empresa-logo"
            (error)="onImageError($event)"
          />

          <div class="empresa-info">
            <h4 class="empresa-nombre">{{ job.company?.name }}</h4>
            <span class="ubicacion">📍 {{ job.location }}</span>
          </div>
        </div>

        <!-- BODY -->
        <div class="oferta-body">
          <h3 class="titulo">{{ job.title }}</h3>

          <p class="descripcion">
            {{
              job.description.length > 100
                ? (job.description | slice: 0:100) + '...'
                : job.description
            }}
          </p>
        </div>

        <!-- BOTÓN -->
        <button class="btn-ver">
          Ver más
        </button>

      </div>

    </div>

  </section>
</div>
