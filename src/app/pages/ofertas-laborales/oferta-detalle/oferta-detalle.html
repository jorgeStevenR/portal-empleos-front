<div class="page-container">
  <section class="detalle-container" *ngIf="!cargando && job">
    
    <div class="detalle-card">

      <!-- LOGO -->
      <img
        [src]="job.company?.logoUrl || 'assets/img/default-job.png'"
        class="empresa-logo"
      />

      <!-- TITULO Y EMPRESA -->
      <h2>{{ job.title }}</h2>
      <h4>{{ job.company?.name }}</h4>
      <p class="ubicacion">📍 {{ job.location }}</p>

      <!-- DESCRIPCIÓN -->
      <p class="descripcion">{{ job.description }}</p>

      <hr />

      <!-- BOTONES -->
      <div class="botones">

        <!-- ⭐ POSTULARME -->
        <button
          *ngIf="auth.getRole() === 'ROLE_USER' && !yaPostulado"
          (click)="irAFormularioPostulacion()"
          class="btn-postular"
        >
          ✔ Postularme
        </button>

        <!-- YA POSTULADO -->
        <button
          *ngIf="auth.getRole() === 'ROLE_USER' && yaPostulado"
          class="btn-ya-postulado"
          disabled
        >
          Ya te has postulado
        </button>

        <!-- VOLVER -->
        <button class="btn-volver" routerLink="/ofertas-laborales">
          ⬅ Volver
        </button>

      </div>

    </div>

  </section>
</div>
