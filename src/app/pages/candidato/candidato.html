<div class="candidato-container">
  
  <h2>Mis postulaciones</h2>

  <div *ngIf="loading">Cargando tus postulaciones...</div>

  <div *ngIf="!loading && applications.length > 0; else noApps">

    <div class="app-card" *ngFor="let app of applications">

      <h3>{{ app.job.title }}</h3>

      <p><strong>Empresa:</strong> {{ app.job.company?.name }}</p>
      <p><strong>Ubicación:</strong> {{ app.job.location }}</p>
      <p><strong>Modalidad:</strong> {{ app.job.mode }}</p>
      <p><strong>Estado:</strong> {{ app.status }}</p>

      <!-- 🔥 Ahora abre el detalle completo -->
      <button class="btn-ver" [routerLink]="['/postulacion-detalle', app.idApplication]">
        Ver detalle
      </button>

    </div>

  </div>

  <ng-template #noApps>
    <p>No te has postulado a ninguna oferta aún.</p>
  </ng-template>

</div>
