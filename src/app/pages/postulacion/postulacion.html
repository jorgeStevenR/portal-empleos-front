<div class="postulacion-container">
  <div class="postulacion-card">

    <h2>Finalizar postulación</h2>

    <p class="sub">
      Estás aplicando a:
      <strong>{{ job?.title }}</strong>
      <br>
      en <strong>{{ job?.company?.name }}</strong>
    </p>

    <label class="label-carta">Carta de presentación:</label>

    <textarea
      [(ngModel)]="coverLetter"
      placeholder="Escribe un mensaje para la empresa..."
    ></textarea>

    <button class="btn-enviar" (click)="enviarPostulacion()">
      ✔ Enviar postulación
    </button>

    <button class="btn-volver" [routerLink]="['/oferta', idJob]">
      ⬅ Volver
    </button>

  </div>
</div>
