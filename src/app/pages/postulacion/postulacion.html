<div class="page-container">
<section class="postulacion-container">
  <h2>📝 Formulario de Postulación</h2>
  <p class="info">
    Adjunta una carta de presentación y una imagen o link opcional.
  </p>

  <form (ngSubmit)="enviarPostulacion()" class="postulacion-form">
    <label>Carta de presentación:</label>
    <textarea [(ngModel)]="carta" name="carta" rows="6" required></textarea>

    <label>Enlace o imagen (opcional):</label>
    <input [(ngModel)]="urlImg" name="urlImg" type="text" />

    <div class="buttons">
      <button type="submit" class="btn-enviar">Enviar postulación</button>
      <button type="button" routerLink="/ofertas-laborales" class="btn-volver">
        Cancelar
      </button>
    </div>
  </form>
</section>
</div>
