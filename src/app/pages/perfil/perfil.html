<div class="perfil-container">

  <!-- ======================= DATOS DEL USUARIO ======================= -->
  <div class="perfil-box">
    <h2>👤 Información del Usuario</h2>

    <div class="campo">
      <label>Nombre:</label>
      <div class="valor">{{ userData.name }}</div>
    </div>

    <div class="campo">
      <label>Correo electrónico:</label>
      <div class="valor">{{ userData.emailEntity?.email }}</div>
    </div>
  </div>

  <!-- ======================= CURRÍCULO ======================= -->
  <div class="perfil-box">
    <h2>📄 Currículum (PDF)</h2>

    <!-- ========== VISOR DE PDF ========== -->
    <div class="pdf-viewer" *ngIf="userData.cvUrl">
      <iframe [src]="userData.cvUrl | safeUrl"></iframe>
    </div>

    <!-- Botones abajo del visor -->
    <div class="botones-cv">

      <!-- Ver CV -->
      <button
        class="btn-ver"
        *ngIf="userData.cvUrl"
        (click)="window.open(userData.cvUrl, '_blank')">
        🔗 Ver CV en nueva pestaña
      </button>

      <!-- Actualizar -->
      <button class="btn-actualizar" (click)="toggleUploader()">
        🔄 Actualizar CV
      </button>

    </div>

    <!-- Uploader -->
    <div class="upload-area" *ngIf="mostrarUploader">
      <input type="file" accept="application/pdf" (change)="onFileSelected($event)" />
      <button class="btn-upload" (click)="uploadFile()">Subir CV</button>
    </div>

  </div>

</div>
