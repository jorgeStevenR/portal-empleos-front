<!-- NAVBAR SUPERIOR SOLO LOGO -->
<div class="login-topbar" (click)="goHome()">
  <img src="assets/img/icono.jpg" class="topbar-logo" alt="Logo" />
  <span class="topbar-title">Portal Empleos</span>
</div>

<section class="login-page">
  <div class="login-container">

    <h1 class="login-title">Iniciar sesión</h1>
    <p class="login-text">
      Optimiza tu búsqueda laboral y conecta con empresas del corredor ecológico.
    </p>

    <form (ngSubmit)="login()" novalidate class="login-form">

      <label for="email">Correo electrónico</label>
      <input
        type="email"
        id="email"
        [(ngModel)]="email"
        name="email"
        placeholder="corredorecologico@gmail.com"
        required
      />

      <label for="password">Contraseña</label>
      <div class="password-box">

        <input
          [type]="showPassword ? 'text' : 'password'"
          id="password"
          [(ngModel)]="password"
          name="password"
          placeholder="**************"
          required
        />

        <span class="eye" (click)="togglePassword()">
          <img *ngIf="!showPassword" src="assets/img/eye.svg.png" />
          <img *ngIf="showPassword" src="assets/img/eye-off.svg.png" />
        </span>

      </div>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Cargando...' : 'Iniciar sesión' }}
      </button>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

    </form>

    <p class="register-text">
      ¿No tienes cuenta?<br />
      <a routerLink="/register-candidato">Registrar Candidato</a> |
      <a routerLink="/register-empresa">Registrar Empresa</a>
    </p>

  </div>
</section>
