<section class="login-page">
  <div class="login-card">
    <h2 class="login-title">Iniciar sesión</h2>
    <p class="login-subtitle">
      Accede al Portal de Empleo del Corredor Ecológico
    </p>

    <form (ngSubmit)="login()" novalidate>
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          placeholder="correo@ejemplo.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          placeholder="********"
          required
        />
      </div>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Cargando...' : 'Ingresar' }}
      </button>

      <p *ngIf="errorMessage" class="error">
        {{ errorMessage }}
      </p>

      <div class="extra-links">
        <span>¿Aún no tienes cuenta?</span><br />
        <a routerLink="/register-candidato">Registrar Candidato</a>
        <span> | </span>
        <a routerLink="/register-empresa">Registrar Empresa</a>
      </div>
    </form>
  </div>
</section>
